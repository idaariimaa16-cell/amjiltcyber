<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дугуйлангийн мэдээлэл 2026–2027 | Амжилт Кибер Сургууль</title>
<style>
:root{--bg:#f7f5fb;--card:#fff;--ink:#1d1830;--mute:#5d5873;--line:#e1dbee;--pri:#5b2e9e;--tag:#efe8fa;--tagi:#46207f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14101f;--card:#1e1830;--ink:#eee9f8;--mute:#aaa3c0;--line:#352c4d;--pri:#c2a0f2;--tag:#2e2447;--tagi:#d8c6f6}}
:root[data-theme="dark"]{--bg:#14101f;--card:#1e1830;--ink:#eee9f8;--mute:#aaa3c0;--line:#352c4d;--pri:#c2a0f2;--tag:#2e2447;--tagi:#d8c6f6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.w{max-width:1000px;margin:0 auto;padding:0 16px}
header{background:var(--card);border-bottom:1px solid var(--line);padding:20px 0}
.sch{font-size:.8rem;font-weight:700;letter-spacing:.04em;color:var(--pri);margin:0}
h1{font-size:1.45rem;line-height:1.25;margin:6px 0}
.sub{margin:0;color:var(--mute)}
.bar{display:grid;gap:10px;margin:18px 0 8px}
input,select{width:100%;min-height:48px;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:0 12px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--pri);outline-offset:1px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}

label{display:block;font-size:.85rem;font-weight:600;color:var(--mute);margin-bottom:4px}
.cnt{color:var(--mute);margin:10px 0}
.grid{display:grid;gap:14px;margin-bottom:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.tag{align-self:flex-start;background:var(--tag);color:var(--tagi);font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:99px}
h2{font-size:1.15rem;line-height:1.3;margin:0}
.p{margin:0;color:var(--mute);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.k{font-size:.8rem;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.03em}
.t{margin:0}
ul.ss{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:6px}
.ss li{border-left:4px solid var(--pri);padding:2px 0 2px 10px}
.ss b{display:block}
.ss span{color:var(--mute);font-size:.95rem}
button{font:inherit;cursor:pointer;min-height:48px;border-radius:10px;border:0;padding:0 18px;font-weight:700}
.go{background:var(--pri);color:#fff;margin-top:auto}
:root[data-theme="dark"] .go{color:#10161f}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .go{color:#10161f}}
.reset{background:var(--tag);color:var(--tagi)}
.empty{text-align:center;padding:36px 12px;background:var(--card);border:1px dashed var(--line);border-radius:14px}
dialog{width:min(640px,calc(100% - 24px));max-height:calc(100% - 24px);border:0;border-radius:16px;padding:0;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dh{position:sticky;top:0;background:var(--card);padding:16px 16px 10px;border-bottom:1px solid var(--line);display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.dh h2{font-size:1.3rem}
.x{background:var(--tag);color:var(--tagi);min-width:48px;font-size:1.3rem;padding:0}
.db{padding:6px 16px 20px;display:grid;gap:14px}
.db ul.sk{margin:4px 0 0;padding-left:20px}
.miss{color:var(--mute);font-style:italic}
footer{border-top:1px solid var(--line);padding:20px 0 28px;color:var(--mute);font-size:.9rem}
footer p{margin:2px 0}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}h1{font-size:1.9rem}}
.logo{display:block;height:56px;width:auto;background:#fff;border-radius:10px;padding:6px 10px;margin-bottom:14px}
.hero{margin:0 0 4px}.hero h2{font-size:1.1rem;margin:0 0 4px}.num{display:inline-block;background:var(--tag);color:var(--tagi);font-weight:700;border-radius:99px;padding:2px 12px;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{min-height:44px;background:var(--card);color:var(--ink);border:1.5px solid var(--line);font-weight:600;padding:0 14px}.chip[aria-pressed=true]{background:var(--pri);border-color:var(--pri);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed=true]{color:#14101f}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed=true]{color:#14101f}}
.today{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--tag);color:var(--tagi);border-radius:12px;padding:10px 14px}.today:empty{display:none}.today button{background:var(--pri);color:#fff;min-height:44px}
:root[data-theme="dark"] .today button{color:#14101f}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .today button{color:#14101f}}
.ic{width:18px;height:18px;vertical-align:-3px;margin-right:6px;fill:none;stroke:var(--pri);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.t .ic{margin-right:6px}.fl{height:36px;width:auto;background:#fff;border-radius:8px;padding:4px 8px;margin-bottom:8px}
</style>
</head>

if(tn){var tc=CLUBS.filter(function(c){return c.g.some(function(g){return g[2]===tn})}).length;$("today").innerHTML='<span><b>Өнөөдөр ('+tn+')</b> '+tc+' дугуйлан хичээллэнэ</span><button id="tb">Харах</button>';$("tb").onclick=function(){$("fd").value=tn;render();$("list").scrollIntoView()}}

function match(c){
var q=$("q").value.trim().toLowerCase(),fc=cat,fg=+$("fg").value,fd=$("fd").value;
if(q){var hay=(c.n+" "+c.c+" "+c.i+" "+c.t+" "+c.g.map(function(g){return g[5]||""}).join(" ")).toLowerCase();if(hay.indexOf(q)<0)return false}

return gs.length>0}
function render(){
